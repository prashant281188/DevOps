name: CI Pipeline for 3 Tier NextJs Webapp


on:
  push: 
    branches: ['main']
  pull_request:  
    branches: ['main']
  workflow_dispatch:
  
jobs:

#########################################################
#                        TEST                           #     
#########################################################
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 1
     
    steps:
    - name: chekout code
      uses: actions/checkout@v4
    
    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: install dependecies
      run: npm ci
      
    - name: test  
      run: echo "testing..."

#########################################################
#                        BUILD                          #     
#########################################################
  build:
    needs: test
    environment: build
    runs-on: ubuntu-slim
    steps:
      - name: chekout code
        uses: actions/checkout@v4
      - run: echo "code checkout successfully with ${{vars.DB_NAME}}"
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.5.0
        with:
        # Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0.
          node-version: 24
          cache: 'npm'

       # Install dependencies across all packages in the workspace
      - name: Install Workspace Dependencies
        run:  npm ci

      
      - name: run build  
        run: |
          npm run build:api
          npm run build:web
          
      - name: upload atrifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: |
            .next
            !.next/cache
            public
            next.config.js
            package-lock.json

#########################################################
#                   DEPLOY-DEMO                         #     
#########################################################
  
  deploy-demo:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v5
        with: 
          name: my-artifact
       

      - name: list download articats
        run: ls -la
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.5.0
        with:
        # Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0.
          node-version: 24
          cache: 'npm'

      - name: install dependecies
        run: npm ci
    
      

      
    
  
     
  
  

